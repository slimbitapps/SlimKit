[package]
name = "slimvoice"
version = "0.3.0"
description = "SlimVoice – dictation that works, in every app"
authors = ["SlimBit Apps"]
edition = "2021"

[lib]
name = "slimvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
futures-util = "0.3"
regex = "1"
once_cell = "1"
base64 = "0.22"
dirs = "6"
cpal = "0.15"
whisper-rs = "0.15"
enigo = "0.5"
arboard = "3"
active-win-pos-rs = "0.9"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.15", features = ["metal"] }
macos-accessibility-client = "0.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.release.package.whisper-rs-sys]
opt-level = 3
