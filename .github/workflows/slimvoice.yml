# Baut SlimVoice (Ordner slimvoice/, Tauri) zum Testen: Installer für Windows und Mac.
# Ergebnis: nicht öffentlich – nur angemeldet unter Actions → letzter Lauf → „Artifacts“ (SlimVoice-Windows, SlimVoice-Mac …).
# Unsigniert: Windows zeigt einmal „Computer wurde geschützt“ → „Weitere Informationen“ → „Trotzdem ausführen“,
# Mac: Rechtsklick auf die App → „Öffnen“.
name: SlimVoice bauen

on:
  push:
    branches: [claude/stoic-ritchie-esp9l9]
    paths: ['slimvoice/**', '.github/workflows/slimvoice.yml', '!slimvoice/**/*.md']
  workflow_dispatch:

defaults:
  run:
    working-directory: slimvoice

# whisper.cpp portabel bauen (läuft auf allen Rechnern, nicht nur auf dem Build-Server)
env:
  CMAKE_PROJECT_INCLUDE: ${{ github.workspace }}/slimvoice/src-tauri/cmake/ggml-portable.cmake

jobs:
  # Tests + Ende-zu-Ende-Test der echten App (Linux) inkl. echter lokaler Erkennung mit Modell-Download
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: slimvoice/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: slimvoice/src-tauri, prefix-key: portable-v1 }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev xvfb imagemagick
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: cargo build --features tauri/custom-protocol
        working-directory: slimvoice/src-tauri
      - name: Gesprochenen Testsatz erzeugen
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          espeak-ng -v en-us -s 140 -w /tmp/speech.wav "Hello, this is a test of the dictation. Everything works fine."
          ffmpeg -loglevel error -y -i /tmp/speech.wav -af "adelay=800,apad=pad_dur=3" -ar 48000 -ac 1 /tmp/mic.wav
      - name: Ende-zu-Ende-Test (mit echter lokaler Erkennung, Modell „Mittel“)
        env: { LOCAL_MODEL: small, SPEECH_WAV: /tmp/mic.wav }
        run: xvfb-run -a -s "-screen 0 1400x900x24" node test/e2e/run.cjs "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: SlimVoice-Screenshots, path: '${{ runner.temp }}/shots' }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: slimvoice/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: slimvoice/src-tauri, prefix-key: portable-v1 }
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis
      - name: Selbsttest der fertigen App (Modell laden, Sprachprobe erkennen, Zeit messen)
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru -FilePath src-tauri/target/release/slimvoice.exe -ArgumentList '--selftest=small' -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer + portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/SlimVoice-Setup.exe
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/slimvoice.exe portable/SlimVoice.exe
          Compress-Archive -Path portable/* -DestinationPath out/SlimVoice-Windows-portable.zip -Force
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: SlimVoice-Windows, path: slimvoice/out/*, if-no-files-found: error }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: slimvoice/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: slimvoice/src-tauri, prefix-key: portable-v1 }
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles dmg
      - name: Selbsttest der fertigen App auf Apple-Chip (Metal + Prozessor, Zeit messen)
        run: src-tauri/target/release/slimvoice --selftest=small
      - run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/SlimVoice-Mac.dmg
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: SlimVoice-Mac, path: slimvoice/out/*, if-no-files-found: error }

  mac-intel:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: slimvoice/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: slimvoice/src-tauri, key: intel, prefix-key: portable-v1 }
      - run: npm ci
      - run: npx tauri build --bundles dmg --target x86_64-apple-darwin
      - run: |
          mkdir -p out
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg out/SlimVoice-Mac-Intel.dmg
      - uses: actions/upload-artifact@v4
        with: { name: SlimVoice-Mac-Intel, path: slimvoice/out/*, if-no-files-found: error }
